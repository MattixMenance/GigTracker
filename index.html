<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GigTracker</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

</head>

<body>

<div class="container">

<h1>GigTracker</h1>

<p class="subtitle">
Driver Business Tracker
</p>

<div class="card">

<h2>Today's Totals</h2>

<h3 id="earnings">
Earnings: $0.00
</h3>

<h3 id="fuel">
Fuel: $0.00
</h3>

<h2 id="profit">
Net Profit: $0.00
</h2>

</div>

<div class="card">

<h2>Add Earnings</h2>

<input
id="earningsInput"
type="number"
step="0.01"
placeholder="Enter Earnings">

<button onclick="addEarnings()">

💵 Add Earnings

</button>

</div>

<div class="card">

<h2>Add Fuel Purchase</h2>

<input
id="fuelInput"
type="number"
step="0.01"
placeholder="Enter Fuel Purchase">

<button onclick="addFuel()">

⛽ Add Fuel

</button>

</div>

<div class="card">

<h2>Today's Activity</h2>

<ul id="history">

</ul>

</div>

<div class="card">

<button class="danger"
onclick="resetToday()">

Reset Today

</button>

</div>

</div>

<script src="app.js"></script>

</body>

</html>
